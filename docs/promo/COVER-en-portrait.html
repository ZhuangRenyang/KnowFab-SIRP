<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  /* 英文封面（竖屏 1080×1920）：与中文版同一套视觉，只换文案与字号
     英文单词比中文长，标题字号从 168px 降到 128px，避免溢出 900px 安全区 */
  :root {
    --bg: #0B0F14;
    --ink: #FFFFFF;
    --ink-dim: #8A94A6;
    --brand: #4C8DFF;
    --accent: #22C55E;
    --line: rgba(255, 255, 255, 0.14);
    --font: Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); font-family: var(--font); -webkit-font-smoothing: antialiased; }

  .cover {
    position: relative;
    width: 1080px; height: 1920px;
    background:
      radial-gradient(900px 700px at 50% 32%, rgba(76, 141, 255, 0.16), transparent 70%),
      linear-gradient(180deg, #0B0F14 0%, #0E141C 55%, #0B0F14 100%);
    overflow: hidden;
    display: flex; flex-direction: column;
    padding: 120px 90px 180px;
  }
  .grid {
    position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 90px 90px;
  }
  .wm {
    position: absolute; right: -70px; top: 50%; transform: translateY(-50%) rotate(-90deg);
    font-size: 300px; font-weight: 900; letter-spacing: 24px;
    color: rgba(255,255,255,0.028); white-space: nowrap; pointer-events: none;
  }
  .brand { position: relative; display: flex; align-items: center; gap: 18px; }
  .dot { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); }
  .brand-t { font-size: 50px; font-weight: 700; letter-spacing: 1px; color: var(--ink); }
  .brand-t em { font-style: normal; color: var(--brand); margin-left: 12px; }

  .main { position: relative; flex: 1; display: flex; flex-direction: column; justify-content: center; }
  h1 { font-size: 128px; font-weight: 900; line-height: 1.1; letter-spacing: -1px; }
  h1 .l1 { display: block; color: var(--ink); }
  h1 .l2 { display: block; color: var(--brand); }
  .sub {
    margin-top: 60px; font-size: 38px; font-weight: 500; color: var(--ink-dim);
    letter-spacing: 1px; line-height: 1.65;
  }
  .tags { position: relative; display: flex; flex-wrap: wrap; gap: 18px; margin-top: auto; }
  .tag {
    padding: 16px 30px; border-radius: 999px; border: 2px solid var(--line);
    font-size: 30px; font-weight: 600; color: rgba(255,255,255,0.86);
    background: rgba(255,255,255,0.03);
  }
  .tag.hl { border-color: rgba(76,141,255,0.6); color: var(--brand); background: rgba(76,141,255,0.10); }
</style>
</head>
<body>
<div class="cover">
  <div class="grid"></div>
  <div class="wm">SIRP</div>

  <div class="brand">
    <div class="dot"></div>
    <div class="brand-t">KnowFab<em>SIRP</em></div>
  </div>

  <div class="main">
    <h1>
      <span class="l1">All machines</span>
      <span class="l2">report output</span>
    </h1>
    <div class="sub">No PLC changes · One installer<br>Data stays on-site</div>
  </div>

  <div class="tags">
    <div class="tag">Any machine</div>
    <div class="tag hl">Relays too</div>
    <div class="tag">Open source</div>
  </div>
</div>
</body>
</html>
