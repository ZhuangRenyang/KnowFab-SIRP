<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0}
body{width:1125px;height:603px;background:#0a0c0d;overflow:hidden;
  font-family:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;position:relative}
.brand{position:absolute;left:56px;top:48px;color:#9be35a;font-weight:700;font-size:26px;letter-spacing:2px}
.brand span{color:#4c8dff}
.ghost{position:absolute;right:-30px;bottom:-40px;font-size:340px;font-weight:900;color:rgba(76,141,255,.07);

.grid{position:absolute;inset:0;

  background-size:56px 56px}
.center{position:absolute;left:0;right:0;top:150px;text-align:center}
.h1{color:#f2f4f3;font-size:88px;font-weight:900;letter-spacing:6px;line-height:1.25}
.h1 b{color:#4c8dff}

.tag.blue{border-color:rgba(76,141,255,.5);color:#7fb5ff}
.foot{position:absolute;bottom:44px;left:0;right:0;text-align:center;color:#5f6b72;font-size:20px;letter-spacing:1px;
  font-family:Consolas,monospace}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#9be35a;margin-right:10px;vertical-align:2px}

<div class="grid"></div>

    <div class="tag">一条命令部署</div>
    <div class="tag blue">全开源</div>
  </div>
</div>
<div class="foot"><span class="dot"></span>github.com/ZhuangRenyang/KnowFab-SIRP</div>
