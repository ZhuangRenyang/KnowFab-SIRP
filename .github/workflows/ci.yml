# CI 门禁（2026-11-06 定稿）
#
# 目的：让「下次升级框架」从「靠人记得跑什么」变成「机器保证」。
#   升级 Boot 3.2 → 4.1 时，202 个编译错误是手动跑 mvn 才发现的；
#   前端 typecheck 长期是红的（9 个错误），于是所有人都不跑它 ——
#   **一个永远红的门禁等于没有门禁**。
#
# 门禁逻辑放在 tools/ci-gate.sh，**不写在本文件里**：
#   ① 本地和 CI 跑同一份脚本，不会走偏；
#   ② 可以注入已知错误来验证门禁真的会红（判据只有这一条）。
#
# ⚠️ **CI 现在会起 MySQL**（2026-11-07 起），与下面那段旧说明相反：
#   原因：全仓 409 个用例都是纯 Mockito 单测（零 @SpringBootTest），
#   **结构上证明不了 Spring 容器能起来**。而框架升级最容易坏的就是这一层
#   （Bean 装配、@Entity 扫描、bean 名冲突、方言映射）—— 全在启动时才暴露。
#   此前只能靠人记得跑 tools/verify-boot-smoke.sh ⇒ 人会忘，CI 不会。
#   ⇒ 新增 ApplicationBootSmokeTest（@Tag("integration")）真起容器 + 真查一次库。
#   它**不进门禁脚本**（门禁的定位是「不需要数据库」），而是作为 CI 的独立一步。
#   本地仍可 `mvn clean test` 全绿（pom 里 excludedGroups=integration）。
name: ci

on:
  push:
    # main 与**所有其他分支**都跑。
    # 为什么连非 main 分支也要跑：升级分支要能在合并前就验，
    # 而不是「推到远程就以为 CI 会跑」——
    # 只配 `branches: [main]` 的话，推分支**不触发**任何 run（2026-11-06 踩过：
    # 推了 upgrade/boot-41，Actions 里一条 run 都没有，白等）。
    # ⚠️ 不能同时写 branches 与 branches-ignore（GitHub 只取其一），所以用通配。
    branches: ['**']
  pull_request:
    branches: [main]
  # 手动触发（排查用）
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    # 加了集成测试后预算变紧：门禁 152 秒 + 集成测试（起容器 + 重新编译 + 真启动）约 2 分钟
    timeout-minutes: 30

    # MySQL 8.4 —— 只服务集成测试（ApplicationBootSmokeTest）。
    # 为什么用真 MySQL 而不是 H2/Testcontainers（详见测试类注释）：
    #   · H2：项目 2026-10-27 已明确「H2 彻底移除，MySQL 是唯一目标库」，
    #         且原生 SQL 用了 from_unixtime / date_format、实体用了 JSON 列 ⇒ 测 H2 等于测另一个库
    #   · Testcontainers：要 Docker。CI 有、开发机不一定有（写这个测试的机器上就没有）
    #   · 真 MySQL：CI 用 service、本地用已有 MySQL ⇒ 两边跑的是同一个数据库
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          # 库名必须含 test —— 测试类里有守卫，非 test/verify 库会直接拒绝运行
          MYSQL_DATABASE: devicehub_test
          MYSQL_USER: devicehub
          MYSQL_PASSWORD: DeviceHub2026
        ports:
          - 3306:3306
        # ⚠️ healthcheck 不能省：没有它，测试可能在 mysqld 还没 ready 时就开始连
        #   ⇒ 表现为「偶发连接失败」⇒ 一个 flaky 的门禁比没有更糟（会让人习惯性重跑）
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - uses: actions/checkout@v4

      # Java 17：pom 的 java.version 就是 17，Spring Boot 4.1 要求 ≥17
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          # ⚠️ **不要用 setup-java 的 `settings-path`**（2026-11-07 实测踩到）：
          #   那个参数要求**绝对路径**（它会拼成 <绝对路径>/settings.xml），
          #   传相对路径 ⇒ setup-java 这一步**直接失败** ⇒ CI 表现为
          #   「setup-java 步骤 0 秒红、门禁根本没跑」⇒ 看起来像「代码有问题」，
          #   其实是配置写错（run #16 就是这样红的）。
          #   ⇒ 镜像改由**门禁脚本自己传 `-s tools/settings.xml`**（见 tools/ci-gate.sh）。
          #   仓库里那份 settings.xml 带 aliyun 镜像：国内到 Maven 中央仓库只有
          #   1-10 kB/s ⇒ 冷缓存 runner 上不带镜像必超时。

      # Node 22：Vite 8 要求 `^20.19.0 || >=22.12.0`
      # （release.yml 用的 node 20 恰好卡在下限，这里用 22 更稳）
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 跑门禁
        env:
          # CI 上用 setup-java 提供的 mvn（本地那套在 ../tools/ 下，CI 里没有）
          MVN: mvn
        run: bash tools/ci-gate.sh

      # 集成测试：真起 Spring 容器 + 真连 MySQL + 真查一次库。
      #
      # 这一步的存在意义（不是「多跑点测试」）：
      #   全仓 409 个用例是纯 Mockito，**证明不了容器能起来**。
      #   框架升级时最容易坏的就是这一层，而它只在启动时暴露。
      #   此前靠人记得跑 tools/verify-boot-smoke.sh ⇒ 人会忘。
      #
      # ⚠️ **不允许「没跑就算过」**：
      #   · 用 -Pintegration（pom 里 exclude 掉 integration 组，profile 里反过来 include）
      #   · 空值覆盖 `-DexcludedGroups=` 不生效 ⇒ 0 个测试但 exit 0（2026-11-07 实测踩到）
      #   · 所以下面还断言「报告里确实有用例数」，防止「一个都没跑却绿」
      #
      # ⚠️ 用 -s tools/settings.xml（aliyun 镜像）：与门禁同一个理由，
      #   冷缓存 runner 上直连 Maven 中央仓库只有 1-10 kB/s。
      - name: 集成测试（真启动 + 真查库）
        env:
          MVN: mvn
          TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/devicehub_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
          TEST_DB_USER: devicehub
          TEST_DB_PASSWORD: DeviceHub2026
        run: |
          set -o pipefail
          mvn -B -s tools/settings.xml test -Pintegration | tee /tmp/it.log
          # 断言真的跑了（不是「0 个测试也算过」）
          RUN=$(grep -a "Tests run:" target/surefire-reports/*.txt 2>/dev/null \
                | sed -n 's/.*Tests run: \([0-9]*\).*/\1/p' | awk '{s+=$1} END {print s+0}')
          echo "集成测试实际执行用例数：$RUN"
          if [ "$RUN" -lt 2 ]; then
            echo "::error::集成测试用例数 $RUN < 2 —— 说明它没真的跑（可能被跳过/没被收集）"
            exit 1
          fi

      # 门禁失败时把关键日志贴出来，省得再点进每个 step 找。
      # 用 `if: always()`：只有失败时才贴，成功时不刷屏。
      - name: 上传失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          # ⚠️ **不能写 `frontend/../target/...`**：GitHub 的 artifact pattern
          #   **禁止 `..` 相对路径** ⇒ 整步会直接失败（annotation:
          #   "Invalid pattern ... Relative pathing '.' and '..' is not allowed"）
          #   ⇒ 门禁失败时**日志反而传不上来**，等于让失败变成「查不出原因」。
          #   ⇒ 门禁的前端段虽然 cd 到 frontend/，但日志路径写的是 `../target/...`
          #   ⇒ 实际仍落在**仓库根的 target/** ⇒ 只写这一条就够。
          # ⚠️⚠️ **必须同时包含 target-logs/**（2026-11-07 运维指出）：
          #   门禁的后端单测日志被挪到了 `target-logs/`（原因：`mvn clean` 会把
          #   `target/` 整个删掉 ⇒ 门禁读不到自己的日志 ⇒ 误判「假绿」）
          #   ⇒ 门禁日志现在**不在** `target/` 下 ⇒ 只写 `target/_ci-*.log` 的话，
          #   **后端单测的日志传不上来** ⇒ CI 红了却看不到最关键的那份日志。
          path: |
            target/_ci-*.log
            target-logs/_ci-*.log
          retention-days: 7
          if-no-files-found: ignore
