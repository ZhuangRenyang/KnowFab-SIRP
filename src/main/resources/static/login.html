<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 知造 SIRP</title>
<script>try{if(localStorage.getItem('dh-theme')==='light')document.documentElement.classList.add('light')}catch(e){}</script>
<style>
  :root{
    --bg:#f6f8f7; --panel:#fbfcfc; --panel2:#f2f5f4; --line:rgba(46,58,62,.085);
    --text:#101418; --muted:#596368; --accent:#236de9; --alarm:#e0443b;
  }
  html.light{
    --bg:#f6f8f7; --panel:#fbfcfc; --panel2:#f2f5f4; --line:rgba(46,58,62,.085);
    --text:#101418; --muted:#596368; --accent:#236de9; --alarm:#e0443b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;
       align-items:center;justify-content:center;padding:20px;
       font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  .box{width:100%;max-width:380px}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
  .logo{width:34px;height:34px;border-radius:10px;background:var(--accent);
        box-shadow:0 0 18px rgba(35,109,233,.35);
        display:flex;align-items:center;justify-content:center}
  .logo svg{display:block}
  h1{font-size:17px;font-weight:500}
  .sub{font-size:12px;color:var(--muted)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;
        box-shadow:0 1px 2px rgba(46,58,62,.05),0 18px 44px rgba(46,58,62,.08)}
  label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}
  input{width:100%;padding:9px 11px;background:var(--panel2);border:1px solid var(--line);
        border-radius:9px;color:var(--text);font-size:14px;outline:none}
  input:focus{border-color:var(--accent)}
  .field{margin-bottom:14px}
  button{width:100%;padding:10px;border:none;border-radius:10px;background:var(--accent);
         color:#fff;font-size:14px;cursor:pointer;
         box-shadow:0 1px 2px rgba(20,66,148,.28),0 8px 18px rgba(35,109,233,.24)}
  button:disabled{opacity:.6;cursor:default}
  .msg{margin-top:12px;font-size:12px;min-height:18px;color:var(--alarm)}
  .tip{margin-top:16px;font-size:11px;color:var(--muted);line-height:1.8}
</style>
</head>
<body>
<div class="box">
  <div class="brand">
    <div class="logo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1"></rect>
        <rect x="14" y="3" width="7" height="7" rx="1"></rect>
        <rect x="3" y="14" width="7" height="7" rx="1"></rect>
        <rect x="14" y="14" width="7" height="7" rx="1"></rect>
      </svg>
    </div>
    <div>
      <h1>知造 SIRP</h1>
      <div class="sub">登录后查看设备、能耗与报警</div>
    </div>
  </div>

  <div class="card">
    <form id="f" onsubmit="return false">
      <div class="field">
        <label>用户名</label>
        <input id="u" autocomplete="username" autofocus>
      </div>
      <div class="field">
        <label>密码</label>
        <input id="p" type="password" autocomplete="current-password">
      </div>
      <button id="btn" onclick="doLogin()">登录</button>
      <div class="msg" id="msg"></div>
    </form>
    <div class="tip">
      忘记密码：让管理员在「系统 → 用户管理」里重置，或者找供应商。<br>
      第一次安装的初始密码在服务器 <code>data/initial-admin.txt</code> 里（或安装日志）。
    </div>
  </div>
</div>

<script>
async function checkLogged(){
  try{
    const r = await fetch('/api/auth/me').then(x => x.json());
    if(r && r.authenticated) location.replace('/');
  }catch(e){}
}

async function doLogin(){
  const u = document.getElementById('u').value.trim();
  const p = document.getElementById('p').value;
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');
  if(!u || !p){ msg.textContent = '请输入用户名和密码'; return; }

  btn.disabled = true;
  btn.textContent = '登录中…';
  msg.textContent = '';
  try{
    const r = await fetch('/api/auth/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username:u, password:p})
    }).then(x => x.json());
    if(r && r.ok){
      location.replace('/');
      return;
    }
    msg.textContent = (r && r.message) || '登录失败';
  }catch(e){
    msg.textContent = '连不上服务器，检查服务是否在跑';
  }finally{
    btn.disabled = false;
    btn.textContent = '登录';
  }
}

document.getElementById('f').addEventListener('submit', doLogin);
document.getElementById('p').addEventListener('keydown', e => {
  if(e.key === 'Enter') doLogin();
});
checkLogged();
</script>
</body>
</html>
